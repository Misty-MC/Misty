[package]
name = "misty"
version = "0.3.8-beta.3"
edition = "2021"
description = "Launcher Minecraft"
authors = ["xTheoxreborn"]
license = "MIT"
repository = "https://github.com/Misty-MC/Misty-Launcher"
build = "build.rs"

# L'exe s'appelle Misty.exe (attendu par la mise à jour automatique et les raccourcis)
[[bin]]
name = "Misty"
path = "src/main.rs"

[dependencies]
# Interface
slint = { version = "1.18", features = ["unstable-winit-030"] }
misty-ui = { path = "misty-ui" }
# Asynchrone + réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures = "0.3"
# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Fichiers
zip = { version = "9", default-features = false, features = ["deflate"] }
sha1 = "0.11"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
dirs = "7"
# Divers
anyhow = "1"
rand = "0.10"
regex = "1"
unicode-normalization = "0.1"
urlencoding = "2"
open = "5"
rfd = "0.18"
discord-rich-presence = "1.1"
sys-locale = "0.3"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
# Connexion Microsoft (fenêtre web lancée dans un sous-processus)
wry = { version = "0.57", default-features = false }
winit = "0.30"
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Dwm"] }
# Musique en jeu : morceau lu par les contrôles multimédia de Windows (services/musique.rs)
# + raccourcis et barre des tâches (services/lanceur.rs)
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
winresource = "0.1"

# Développement : « cargo run » reste rapide à recompiler, mais l'interface est fluide
# (Slint, le rendu et les images sont compilés optimisés une fois pour toutes).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Pas d'informations de débogage pour les dépendances : l'exe de développement passe de près de
# 900 Mo à beaucoup moins, et l'édition de liens (lente sous Windows) en est d'autant plus rapide.
# Le code du launcher garde les siennes.
debug = false

# L'interface générée (près de 20 Mo de Rust) : le même niveau que le launcher, sinon chaque
# changement dans ui/*.slint prendrait plusieurs minutes de plus
[profile.dev.package.misty-ui]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
