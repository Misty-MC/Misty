plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+mc${minecraft_version}"
base.archivesName = 'misty-client'

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	// Only the Fabric API modules the mod uses, shipped inside the jar: nothing else to install.
	['fabric-api-base', 'fabric-resource-loader-v1', 'fabric-key-mapping-api-v1', 'fabric-lifecycle-events-v1'].each {
		def module = fabricApi.module(it, fabric_api_version)
		implementation module
		include module
	}
}

processResources {
	def props = [version: project.version, minecraft: minecraft_version, loader: loader_version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('../LICENSE.txt') {
		rename { 'LICENSE_misty-client.txt' }
	}
}
